services:
  bot:
    image: ghcr.io/sediakinivan/finance-bot:${IMAGE_TAG:-latest}
    container_name: financebot
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GOOGLE_SHEET_ID: 1I6_HFCMVmxOD5buP6RdhtfJHld66tj7oMGArpW4AEC4
      TELEGRAM_USER_SHEETS: ""
      GOOGLE_CREDENTIALS_FILE: /run/secrets/google-service-account.json
    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
