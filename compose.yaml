services:
  bot:
    image: ghcr.io/sediakinivan/finance-bot:${IMAGE_TAG:-latest}
    container_name: financebot
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Owner-approved v2 workbook; overrides the previous v1 value in .env.
      GOOGLE_SHEET_ID: 1jaEzmJPqYzxSp-HtDw-zwt_kPqSEs4enBrkG-Lc-UzA
      GOOGLE_CREDENTIALS_FILE: /run/secrets/google-service-account.json
      CATEGORY_CHANGE_STATE_DIR: /var/lib/financebot/category-changes
    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
      - ./secrets/category-changes:/var/lib/financebot/category-changes:rw
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
